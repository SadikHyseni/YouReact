<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouReact - Emotion-based Recommendations</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans&display=swap" rel="stylesheet">
    <style>
          html, body {
    width: 300px;
    height: 200px;
    padding: 0;
    margin: 0;
    overflow: hidden; /* prevents overflow from showing sharp corners */
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6a5af9, #6bc1ff);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 50px; /* ensures smooth corners */
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
        h1 {
            font-size: 20px;
            margin: 10px 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        #logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }


    </style>
</head>
<body>
    <img src="icon.png" alt="Emotion Recommendation System Logo" id="logo">
    <h1>YouReact</h1>
    <p>Emotion-based recommendations for YouTube videos by Sadik Hyseni.</p>
</body>
</html>
